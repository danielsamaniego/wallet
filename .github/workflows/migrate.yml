name: Run Prisma Migrations

on:
  push:
    branches: [main, staging]
    paths:
      - 'prisma/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target branch/environment'
        required: true
        default: 'staging'
        type: choice
        options: [main, staging]

jobs:
  migrate:
    name: Prisma Migrate Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm prisma migrate deploy --config prisma/prisma.config.ts
        env:
          DATABASE_URL: ${{ github.ref_name == 'main' && secrets.DIRECT_URL || secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ github.ref_name == 'main' && secrets.DIRECT_URL || secrets.STAGING_DIRECT_URL }}

      - name: Apply database safety nets
        run: pnpm prisma db execute --file prisma/immutable_ledger.sql --config prisma/prisma.config.ts
        env:
          DATABASE_URL: ${{ github.ref_name == 'main' && secrets.DIRECT_URL || secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ github.ref_name == 'main' && secrets.DIRECT_URL || secrets.STAGING_DIRECT_URL }}
